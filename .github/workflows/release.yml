name: Create Release

on:
  pull_request_target:
    types: [closed]

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged && (contains(github.event.pull_request.labels.*.name, 'major') || contains(github.event.pull_request.labels.*.name, 'minor') || contains(github.event.pull_request.labels.*.name, 'patch'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      # Needed to make the test load by gyp during npm install of the prebuild binding for node-speaker work
      - name: Setup Virtual ALSA Device
        uses: ./.github/actions/setup-virtual-alsa
      - name: Set node version
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Install modules
        run: npm ci
      # The usb package uses NAPI-RS with per-platform optional npm packages (@node-usb/usb-{platform}-{arch}).
      # npm only installs the binding matching the build machine's architecture.
      # Since the release tarball is deployed across multiple platforms, all platform bindings must be included.
      # The version is read from the lockfile to stay in sync with the installed usb package.
      - name: Install cross-platform USB bindings
        run: |
          USB_VERSION=$(node -e "const lock = JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log(lock.packages['node_modules/usb'].version)")
          echo "Installing @node-usb bindings at version ${USB_VERSION}"
          npm install --no-save --force \
            @node-usb/usb-darwin-arm64@${USB_VERSION} \
            @node-usb/usb-darwin-x64@${USB_VERSION} \
            @node-usb/usb-linux-arm-gnueabihf@${USB_VERSION} \
            @node-usb/usb-linux-arm64-gnu@${USB_VERSION} \
            @node-usb/usb-linux-arm64-musl@${USB_VERSION} \
            @node-usb/usb-linux-x64-gnu@${USB_VERSION} \
            @node-usb/usb-linux-x64-musl@${USB_VERSION} \
            @node-usb/usb-win32-arm64-msvc@${USB_VERSION} \
            @node-usb/usb-win32-ia32-msvc@${USB_VERSION} \
            @node-usb/usb-win32-x64-msvc@${USB_VERSION}
      - name: Tag
        id: set_tag
        uses: K-Phoen/semver-release-action@v1.3.2
        with:
          release_branch: main
          release_strategy: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save version into file
        run: echo "export const APP_VERSION = '${{ steps.set_tag.outputs.tag }}';" > ./src/version.ts
      - name: Build app
        run: |
          npm run build
      - name: Linting
        run: |
          npm run lint
      - name: Type tests
        run: |
          npm run test:type
      - name: Unit tests with coverage
        run: |
          npm run test:coverage
      - name: Integration tests
        run: |
          npm run test:integration
      - name: Compress build
        uses: a7ul/tar-action@v1.2.0
        id: compress
        with:
          command: c
          cwd: ./
          files: |
            ./dist
            ./node_modules
          outPath: dist.tar.gz
      - name: Create Release Notes File
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "$COMMIT_MESSAGE" > ./release_notes.txt
      - name: Create release
        uses: ncipollo/release-action@v1
        env:
          TAG: ${{ steps.set_tag.outputs.tag }}
        with:
          tag: ${{ steps.set_tag.outputs.tag }}
          bodyFile: './release_notes.txt'
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "dist.tar.gz"
