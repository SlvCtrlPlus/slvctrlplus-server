name: Create Release

on:
  pull_request_target:
    types: [closed]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged && (contains(github.event.pull_request.labels.*.name, 'major') || contains(github.event.pull_request.labels.*.name, 'minor') || contains(github.event.pull_request.labels.*.name, 'patch'))
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      # Needed to make the test load by gyp during npm install of the prebuild binding for node-speaker work
      - name: Setup Virtual ALSA Device
        uses: ./.github/actions/setup-virtual-alsa
      - name: Set node version
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Install modules
        run: npm ci
      - name: Determine next version
        id: set_tag
        uses: K-Phoen/semver-release-action@v1.3.2
        with:
          release_branch: main
          release_strategy: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save version into file
        run: echo "export const APP_VERSION = '${{ steps.set_tag.outputs.tag }}';" > ./src/version.ts
      - name: Build app
        run: |
          npm run build
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ^12.7.0 # forceIgnoresPlatform was added in 12.7.0
      - name: Reinstall production modules with all platform bindings
        run: |
          rm -rf node_modules
          pnpm import
          pnpm install --prod --force --frozen-lockfile --ignore-scripts \
            --config.force-ignores-platform=true \
            --config.node-linker=hoisted
      - name: Compress build
        uses: a7ul/tar-action@v1.2.0
        with:
          command: c
          cwd: ./
          files: |
            ./dist
            ./node_modules
          outPath: dist.tar.gz
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tar.gz

  platforms:
    needs: build
    uses: ./.github/workflows/platforms.yml

  smoke-test:
    needs: [build, platforms]
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJSON(needs.platforms.outputs.matrix) }}

    runs-on: ${{ matrix.combo.runs-on }}

    name: Smoke test on ${{ matrix.combo.platform }}

    steps:
      - name: Checkout actions
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          sparse-checkout: .github/actions
      - name: Setup Virtual ALSA Device
        uses: ./.github/actions/setup-virtual-alsa
      - name: Set node version
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Start server and check version
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
          LOG_LEVEL: info
          PORT: '1337'
        run: |
          mkdir release && tar -xzf dist.tar.gz -C release && cd release
          node dist/index.js > server.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${PORT}/version" | grep -q "\"${TAG}\""; then OK=1; break; fi
            kill -0 $PID 2>/dev/null || break
            sleep 1
          done
          kill $PID 2>/dev/null || true
          cat server.log
          [ "$OK" = 1 ]

  release:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.build.outputs.tag }}
          commit: ${{ github.event.pull_request.merge_commit_sha }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "dist.tar.gz"
